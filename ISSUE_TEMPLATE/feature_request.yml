name: Feature request
description: 期望的新功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前项目存在哪些问题
      description: 描述使用场景与痛点
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的新功能
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与其他需要说明的内容
    validations:
      required: false
