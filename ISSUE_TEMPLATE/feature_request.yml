name: Feature request
description: 想要的新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景与痛点，不必先想实现方案。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
    validations:
      required: false
